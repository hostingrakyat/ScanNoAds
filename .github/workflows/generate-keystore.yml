name: Generate Keystore

# Run this ONCE manually to create a release signing keystore. It prints the
# four values you must add as repository secrets, and uploads the keystore
# file as a private artifact so you have a backup. Nothing is committed.
#
# How to use:
#   1. Actions -> Generate Keystore -> Run workflow (branch: any)
#   2. Open the finished run -> read the summary -> copy the four values
#   3. Settings -> Secrets and variables -> Actions -> New repository secret
#      Create: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS
#   4. Optionally download the `upload-key.jks` artifact and keep it safe
#      (losing it means you can never publish updates to the same app on Play)
#   5. Re-run the Build APK & AAB workflow - it will now release-sign the APK

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        id: gen
        run: |
          set -e
          STORE_PASSWORD=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)
          KEY_PASSWORD=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)
          KEY_ALIAS="upload"

          keytool -genkeypair \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore upload-key.jks \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Riovan Styx Roring, OU=365 Days App Challenge, O=ITK, L=Balikpapan, ST=Kalimantan Timur, C=ID"

          KEYSTORE_BASE64=$(base64 -w0 upload-key.jks)

          # NOTE: the random passwords below are intentionally NOT masked.
          # add-mask also redacts $GITHUB_STEP_SUMMARY, which would hide the
          # values you need to copy. The summary is only visible to repo
          # collaborators (the same trust boundary as repo secrets), so this
          # is the correct channel for one-time sharing.

          {
            echo "## Keystore generated"
            echo ""
            echo "### Step 1 - Add these four repository secrets"
            echo "Settings -> Secrets and variables -> Actions -> New repository secret"
            echo ""
            echo '| Secret name | Value |'
            echo '| --- | --- |'
            echo "| \`KEY_ALIAS\` | \`$KEY_ALIAS\` |"
            echo "| \`KEYSTORE_PASSWORD\` | \`$STORE_PASSWORD\` |"
            echo "| \`KEY_PASSWORD\` | \`$KEY_PASSWORD\` |"
            echo "| \`KEYSTORE_BASE64\` | (copy from the collapsed block below) |"
            echo ""
            echo "<details><summary>Click to reveal KEYSTORE_BASE64</summary>"
            echo ""
            echo '```'
            echo "$KEYSTORE_BASE64"
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "### Step 2 - Save the keystore artifact"
            echo "Download \`upload-key.jks\` from this run's **Artifacts** section"
            echo "and store it somewhere safe. If you lose it, you can never push"
            echo "updates to the same app listing on Google Play."
            echo ""
            echo "### Step 3 - Re-run the build"
            echo "Trigger **Build APK & AAB** - it will detect the secrets and"
            echo "release-sign both the APK and the AAB automatically."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload keystore as artifact
        uses: actions/upload-artifact@v4
        with:
          name: upload-key.jks
          path: upload-key.jks
          retention-days: 90
