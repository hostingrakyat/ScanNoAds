name: Generate Keystore

# Run this ONCE manually. It creates a signing keystore and prints the four
# values you must add as repository secrets (Settings -> Secrets and variables
# -> Actions). Nothing is committed to the repo.

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          set -e
          STORE_PASSWORD=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)
          KEY_PASSWORD=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)
          KEY_ALIAS="upload"

          keytool -genkeypair \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore upload-key.jks \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Riovan Styx Roring, OU=365 Days App Challenge, O=ITK, L=Balikpapan, ST=Kalimantan Timur, C=ID"

          KEYSTORE_BASE64=$(base64 -w0 upload-key.jks)

          {
            echo "## Keystore generated"
            echo ""
            echo "Add these as **repository secrets**:"
            echo ""
            echo '| Secret name | Value |'
            echo '| --- | --- |'
            echo "| \`KEYSTORE_BASE64\` | (see collapsed block below) |"
            echo "| \`KEYSTORE_PASSWORD\` | \`$STORE_PASSWORD\` |"
            echo "| \`KEY_PASSWORD\` | \`$KEY_PASSWORD\` |"
            echo "| \`KEY_ALIAS\` | \`$KEY_ALIAS\` |"
            echo ""
            echo "<details><summary>KEYSTORE_BASE64</summary>"
            echo ""
            echo '```'
            echo "$KEYSTORE_BASE64"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
