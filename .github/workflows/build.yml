name: Build APK & AAB

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Decode and verify keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          set -e
          echo "$KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d > android/app/upload-key.jks

          # Trim any whitespace / newline added by copy-paste before writing
          # to key.properties - java.util.Properties preserves trailing
          # whitespace, which silently breaks signing otherwise.
          STORE_PW="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d ' \r\n\t')"
          KEY_PW="$(printf '%s' "$KEY_PASSWORD" | tr -d ' \r\n\t')"
          ALIAS="$(printf '%s' "$KEY_ALIAS" | tr -d ' \r\n\t')"

          cat > android/key.properties <<EOF
          storeFile=app/upload-key.jks
          storePassword=$STORE_PW
          keyAlias=$ALIAS
          keyPassword=$KEY_PW
          EOF

          # Fail fast with a clear message if the secrets don't match the
          # keystore - otherwise Gradle dies deep inside packageRelease
          # with an opaque "Given final block not properly padded" error.
          if ! keytool -list -keystore android/app/upload-key.jks -storepass "$STORE_PW" -alias "$ALIAS" >/dev/null 2>&1; then
            echo "::error::Keystore secrets do not match. Re-run 'Generate Keystore' and update KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD (same value as KEYSTORE_PASSWORD), and KEY_ALIAS exactly as shown in that workflow's summary."
            exit 1
          fi
          echo "Keystore verified - release signing enabled."

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Build App Bundle (release)
        run: flutter build appbundle --release

      - name: Rename artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/ScanNoAds-release.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/ScanNoAds-release.aab
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScanNoAds-apk
          path: dist/ScanNoAds-release.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScanNoAds-aab
          path: dist/ScanNoAds-release.aab

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Scan No Ads build ${{ github.run_number }}
          body: |
            Automated build of Scan No Ads (365 Days App Challenge - Day 3).
            - APK: install directly on Android.
            - AAB: for Google Play upload.
          files: |
            dist/ScanNoAds-release.apk
            dist/ScanNoAds-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build/
            android/
          retention-days: 5
