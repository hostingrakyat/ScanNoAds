name: scan_no_ads
description: "Scan No Ads - Free document scanner. No ads, no watermark, offline forever."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cunning_document_scanner: ^1.2.3
  image: ^4.2.0
  pdf: ^3.11.1
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2
  share_plus: ^10.0.2
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  intl: ^0.19.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
